
name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build, test and verify
    runs-on: ntnu-runners
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Diagnose runner environment
        run: |
          echo "=== OS ==="
          cat /etc/os-release
          echo "=== Java ==="
          java -version
          echo "=== Project directory ==="
          ls -la event-manager-fx
          echo "=== Maven wrapper ==="
          ls -la event-manager-fx/mvnw
          ls -la event-manager-fx/.mvn/wrapper

      - name: Install Xvfb and JavaFX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            x11-utils \
            libgtk-3-0 \
            libgl1-mesa-dri \

      - name: Start virtual display
        run: |
          Xvfb :99 -screen 0 1280x1024x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          sleep 2

      - name: Verify virtual display
        run: |
          echo "DISPLAY=$DISPLAY"
          xdpyinfo
          echo "=== Xvfb process ==="
          pgrep -a Xvfb || true

      - name: Build and verify with Maven
        working-directory: event-manager-fx
        env:
          JDK_JAVA_OPTIONS: "-Djdk.gtk.verbose=true"
        run: |
          ./mvnw --version
          ./mvnw --batch-mode --no-transfer-progress clean verify
